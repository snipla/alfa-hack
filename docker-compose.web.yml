name: alfahack

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-shtrmx.ru}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/alfa/nginx:/etc/nginx/templates:ro
      - /opt/alfa/nginx/certs:/etc/nginx/certs:ro
    networks:
      - alfahack-web

networks:
  alfahack-web:
    name: alfahack-web
    driver: bridge