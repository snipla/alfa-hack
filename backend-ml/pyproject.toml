[project]
name = "ml-backend"
version = "0.1.0"
description = "Serving data analysing models for buisness logic"
requires-python = "==3.12.*"
dependencies = [
    # AI/ML deps
    "catboost>=1.2.10",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    # Webserver deps
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.1",
    "pydantic>=2.14.1",
    "fastapi[standard]>=0.159.1",
    "cryptography>=50.0.2",
    # System & testing
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "scalar-fastapi>=1.9.1",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
