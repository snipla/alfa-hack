server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    
    include /etc/nginx/conf.d/snippets/ssl-params.conf;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name *.shtrmx.ru shtrmx.ru;
    return 301 https://$host$request_uri;
}