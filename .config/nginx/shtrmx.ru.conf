server {
    server_name shtrmx.ru;
    listen 443 ssl reuseport;
    listen [::]:443 ssl reuseport;
    http2 on;

    include /etc/nginx/conf.d/snippets/ssl-params.conf;
    include /etc/nginx/conf.d/snippets/security-headers.conf;

    location / {
        return 301 https://app.shtrmx.ru$request_uri;
    }
}