[project]
name = "backend"
version = "0.1.0"
description = "Alfa-hack buisness logic implementation"
requires-python = "==3.14.*"
dependencies = [
    # Webserver deps
    "fastapi[standard]>=0.159.1",
    "uvicorn[standard]>=0.54.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    # System & testing deps
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    # Buisness logic deps
    "aiomysql>=0.3.2",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.0",
    "jinja2>=3.1.6",
    
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
